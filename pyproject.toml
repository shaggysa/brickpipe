[project]
name = "brickpipe"
version = "0.1.0"
requires-python = ">=3.10"
description = "A json IPC interface for interacting with pybricks hubs"
readme = "README.md"
dependencies = [
    "packaging>=26.2",
    "pybricksdev==2.3.2",
    "pyusb>=1.3.1",
    "reactivex>=4.1.0",
    "bleak>=3.0.1"
]

[project.urls]
"Source Code" = "https://github.com/shaggysa/brickpipe"
"Issues" = "https://github.com/shaggysa/brickpipe/issues"